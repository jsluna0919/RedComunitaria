<div class="form-container">
    <h2>Registro de Emprendimiento</h2>
    
    <form (ngSubmit)="onSubmit()" #emprendimientoForm="ngForm">

        <div class="form-group">
            <label for="codigo">Id usuario:</label>
            <input type="number" id="codigo" name="codigo" [(ngModel)]="emprendimiento.codigo" required>
        </div>

        <div class="form-group">
            <label for="pais">País (ISO3):</label>
            <select id="pais" name="pais" [(ngModel)]="emprendimiento.iso3" required>
                <option *ngFor="let p of paises" [ngValue]="p.iso3">
                    {{ p.nombre }} ({{ p.iso3 }})
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre del emprendimiento:</label>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="emprendimiento.nombre" required>
        </div>

        <div class="form-group">
            <label for="anioFundacion">Año de Fundación:</label>
            <input type="number" id="anioFundacion" name="anioFundacion" [(ngModel)]="emprendimiento.anioFundacion" required>
        </div>

        <div class="form-group">
            <label for="sitioWeb">Sitio Web:</label>
            <input type="url" id="sitioWeb" name="sitioWeb" [(ngModel)]="emprendimiento.sitioWeb">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" [(ngModel)]="emprendimiento.descripcion" rows="4" required></textarea>
        </div>

        <button type="submit" [disabled]="!emprendimientoForm.valid">Registrar Emprendimiento</button>
    </form>
</div>
